<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title id="pageTitle">Login - Smart City</title>
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="../css/default.css" />
    <link rel="stylesheet" href="../css/login.css" />
  </head>
  <body>
    <nav class="navbar bg-body-tertiary">
      <div class="container-fluid justify-content-center">
        <p class="navbar-brand mb-0 h1 fw-bolder">
          SMART <span class="text-primary">CITY</span>
        </p>
      </div>
    </nav>
    <main class="container">
      <h3 id="loginTitle" class="text-center mb-5 fw-bold">LOGIN</h3>

      <section class="card shadow">
        <div class="row g-0">
          <!-- Kiri: form login -->
          <div id="leftPanel" class="col-md-6 p-4 border-end">
            <div class="d-flex justify-content-center align-items-center mb-3">
              <i id="userIcon" class="fa-solid fa-circle-user fa-3x"></i>
            </div>

            <form id="loginForm">
              <div class="mb-3">
                <label>Email</label>
                <input
                  type="email"
                  id="email"
                  class="form-control"
                  placeholder="Masukkan Email"
                  required
                />
              </div>
              <div class="mb-3">
                <label>Password</label>
                <div class="input-group">
                  <input
                    type="password"
                    id="password"
                    class="form-control"
                    placeholder="Masukkan Password"
                    required
                  />
                  <button
                    type="button"
                    class="btn btn-outline-secondary toggle-password"
                    data-target="password"
                  >
                    <i class="fa-solid fa-eye"></i>
                  </button>
                </div>
              </div>
              <div class="mb-3 d-flex justify-content-center">
                <div
                  class="g-recaptcha"
                  data-sitekey="__RECAPTCHA_SITE_KEY__"
                ></div>
              </div>
              <!-- right before the submit button -->
              <input type="hidden" name="_csrf" value="__CSRF_TOKEN__" />
              <button type="submit" id="loginButton" class="btn w-100 mb-2">
                Login
              </button>
            </form>
            <div class="text-center mt-3">
              <div id="googleLoginSection" class="text-center mt-3">
                <p class="text-muted">— atau —</p>
                <a href="/auth/google" class="btn btn-danger">
                  <i class="fa-brands fa-google me-2"></i> Login dengan Google
                </a>
              </div>
            </div>
          </div>

          <!-- Kanan: informasi tambahan -->
          <div
            id="rightPanel"
            class="col-md-6 p-4 d-flex justify-content-center align-items-center flex-column"
          >
            <h3 id="rightTitle" class="text-center fw-bold">
              BELUM PUNYA AKUN?
            </h3>
            <p id="rightText">
              Daftar sekarang dan mulai gunakan layanan kami!
            </p>
            <a
              id="registerLink"
              class="btn btn-outline-primary"
              href="register.html"
              >REGISTER</a
            >
            <div class="text-center mt-3"></div>
          </div>
        </div>
      </section>
    </main>

    <footer>
      <p class="text-center">
        @ 2026 Smart City Pengaduan. All rights reserved.
      </p>
    </footer>

    <!-- Login logic (dari file terpisah) -->
    <script src="../js/login.js"></script>
    <script src="../js/passwordToggle.js"></script>
  </body>
</html>
